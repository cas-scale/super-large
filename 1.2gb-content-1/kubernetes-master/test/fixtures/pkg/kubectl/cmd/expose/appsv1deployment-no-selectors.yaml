apiVersion: apps/v1
kind: Deployment
metadata:
  name: expose-test-deployment
  labels:
    name: expose-test-deployment
spec:
  replicas: 3
  template:
    metadata:
      labels:
        name: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
